services:
  - type: web
    name: ai-quiz-generator-api
    env: python
    rootDir: backend
    buildCommand: bash -lc "apt-get update && apt-get install -y tesseract-ocr && pip install -r requirements-core.txt"
    startCommand: gunicorn app.main:app --worker-class uvicorn.workers.UvicornWorker --workers 1 --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.4"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: CELERY_BROKER_URL
        sync: false
      - key: CELERY_RESULT_BACKEND
        sync: false
      - key: CORS_ORIGINS
        value: "https://ai-quiz-generator.vercel.app,https://ai-quiz-generator-orcin.vercel.app,https://ai-quizgenerator.onrender.com,http://localhost:3000,http://localhost:5173"
      - key: ENVIRONMENT
        value: "production"
      - key: DEBUG
        value: "False"
